{% extends 'base.html' %}
{% block content %}
    <h2>Delete {{ activity.name }}</h2>
    <form method="POST">
        {%  csrf_token %}
        {{ form.as_p }}
        <p>Are you sure you want to delete the activity "{{ activity.name }}" forever?</p>
        <div>
            <button type="submit">YES</button>
        </div>
    </form>
    <a href="{% url 'activity_details' activity.pk %}">Cancel</a>
{% endblock %}
