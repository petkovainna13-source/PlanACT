{% extends 'base.html' %}

{% block content %}

<section class="page-intro">
    <span class="eyebrow">CREATE SOMETHING NEW</span>
    <h1>Add an Adventure</h1>
    <p>Have a great activity in mind? Add it to PlanACT and inspire your next outing.</p>
</section>

<section class="activity-form-card">

    <div class="form-card-header">
        <h2>Adventure Details</h2>
        <p>Fill in the information below to create your activity.</p>
    </div>

    <form method="post"
          enctype="multipart/form-data"
          class="activity-form">

        {% csrf_token %}

        {{ form.as_p }}

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">
                + Create Activity
            </button>

            <a href="{% url 'activities' %}" class="btn btn-secondary">
                Cancel
            </a>
        </div>

    </form>

</section>

{% endblock %}
