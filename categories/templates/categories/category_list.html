{% extends 'base.html' %}

{% block content %}
    <h1>Explore Categories</h1>

    {% for category in category_list %}
        <p>{{ category.name }}</p>
        <p>{{ category.description }}</p>
        <a href="{% url 'category_edit' category.pk %}">Edit Category</a>
        <a href="{% url 'category_delete' category.pk %}">Delete Category</a>
    {% empty %}
        <p>No categories available yet.</p>
    {% endfor %}
{% endblock %}
