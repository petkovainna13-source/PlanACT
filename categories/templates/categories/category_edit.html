
{% extends 'base.html' %}

{% block content %}

<section class="page-intro">
    <span class="eyebrow">KEEP THINGS ORGANIZED</span>
    <h1>Edit Category</h1>
    <p>Update your category to keep your adventures organized.</p>
</section>

<section class="activity-form-card">

    <div class="form-card-header">
        <h2>Update Category Details</h2>
        <p>Make your changes below and save when you're ready.</p>
    </div>

    <form method="post" class="activity-form">
        {% csrf_token %}

        {{ form.as_p }}

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">
                Save Changes
            </button>

            <a href="{% url 'category_list' %}" class="btn btn-secondary">
                Cancel
            </a>
        </div>
    </form>

</section>

{% endblock %}
