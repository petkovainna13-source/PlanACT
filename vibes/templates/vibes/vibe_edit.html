
{% extends 'base.html' %}

{% block content %}

<section class="page-intro">
    <span class="eyebrow">REFINE THE FEELING</span>
    <h1>Edit Vibe</h1>
    <p>Sometimes the mood changes. Give your vibe a fresh name.</p>
</section>

<section class="activity-form-card">

    <div class="form-card-header">
        <h2>Update Vibe Details</h2>
        <p>Edit the name below and save your changes.</p>
    </div>

    <form method="post" class="activity-form">
        {% csrf_token %}

        {{ form.as_p }}

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">
                Save Changes
            </button>

            <a href="{% url 'vibe_list' %}" class="btn btn-secondary">
                Cancel
            </a>
        </div>
    </form>

</section>

{% endblock %}
