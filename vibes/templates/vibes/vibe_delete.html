
{% extends 'base.html' %}

{% block content %}

<section class="page-intro">
    <span class="eyebrow">ONE LAST CHECK</span>
    <h1>Delete Vibe</h1>
    <p>Are you ready to say goodbye to this vibe?</p>
</section>

<section class="delete-card">

    <div class="delete-warning-icon">!</div>

    <h2>Delete "{{ vibe.name }}"?</h2>

    <p class="delete-description">
        Are you sure you want to permanently delete this vibe?
        This action cannot be undone.
    </p>

    <div class="delete-highlight">
        <strong>{{ vibe.name }}</strong>
    </div>

    <form method="post" class="delete-form">
        {% csrf_token %}

        <div class="delete-actions">
            <button type="submit" class="btn btn-danger">
                Yes, Delete Vibe
            </button>

            <a href="{% url 'vibe_list' %}"
               class="btn btn-secondary">
                No, Keep It
            </a>
        </div>
    </form>

</section>

{% endblock %}
